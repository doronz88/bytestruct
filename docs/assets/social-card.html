<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 640px; }
  body {
    display: flex; flex-direction: column; justify-content: center;
    padding: 0 84px;
    background: radial-gradient(125% 140% at 82% 8%, #3949ab 0%, #1a237e 52%, #0c1030 100%);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #ffffff;
    position: relative;
    overflow: hidden;
  }
  .row { display: flex; align-items: center; gap: 48px; z-index: 1; }
  .logo-wrap {
    flex: none; width: 280px; height: 280px;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 50% 50%, rgba(255,255,255,0.22) 0%, rgba(255,255,255,0.10) 38%, rgba(255,255,255,0) 70%);
  }
  .logo { height: 220px; filter: drop-shadow(0 10px 28px rgba(0,0,0,0.35)); }
  .name { font-size: 96px; font-weight: 800; letter-spacing: -3px; line-height: 1.0; white-space: nowrap; }
  .name .s { color: #ffd740; }
  .tagline { margin-top: 30px; font-size: 38px; font-weight: 400; color: #ccd3f7; max-width: 1100px; line-height: 1.3; z-index: 1; }
  .pill { display:inline-block; margin-top: 30px; font-size: 25px; color:#9fb0ec; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; z-index:1; }
  .bar { position:absolute; left:0; bottom:0; height:12px; width:100%; background: linear-gradient(90deg,#ffffff 0%,#ffffff 50%,#8c9eff 50%,#8c9eff 75%,#ffd740 75%,#ffd740 100%); }
</style>
</head>
<body>
  <div class="row">
    <div class="logo-wrap"><img class="logo" src="logo.svg"></div>
    <div class="name">byte<span class="s">struct</span></div>
  </div>
  <div class="tagline">Typed, dependency-free binary records and composable codecs for Python &mdash; built on the standard library's <code>struct</code>.</div>
  <div class="pill">$ python3 -m pip install -U bytestruct</div>
  <div class="bar"></div>
</body>
</html>
