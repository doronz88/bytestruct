name: Python application

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  release:
    types: [ created ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: '! github.event.pull_request.draft'
    runs-on: ${{ matrix.os }}

    # Pin uv to the interpreter it provisioned instead of an already-installed system Python.
    env:
      UV_PYTHON_PREFERENCE: only-managed

    strategy:
      fail-fast: false
      matrix:
        # 3.15 is a prerelease (uv resolves it to the latest beta).
        python-version: [ "3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "3.15" ]
        os: [ ubuntu-latest, macos-latest, windows-latest ]

    steps:
      - uses: actions/checkout@v4
        with:
          # setuptools_scm derives the version from the tags.
          fetch-depth: 0
      # uv provisions the interpreter (python-build-standalone): unlike actions/setup-python,
      # it still provides 3.9 on current runner images (ubuntu-24.04, arm64 macOS).
      - name: Install uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
      - name: Run pre-commit hooks
        # pyright needs the project installed; it runs in the dedicated job below.
        env:
          SKIP: pyright
        run: uvx pre-commit run --all-files
      - name: Run tests
        run: uv run --extra test pytest

  pyright:
    if: '! github.event.pull_request.draft'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
      - name: Install dependencies
        run: |
          uv venv
          uv pip install -e ".[test]"
      # Runs the same pre-commit hook contributors get locally (pinned in .pre-commit-config.yaml).
      - name: Run pyright
        run: uvx pre-commit run pyright --all-files
