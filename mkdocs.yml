site_name: bytestruct
site_description: Typed, dependency-free binary records and composable codecs for Python
site_url: https://doronz88.github.io/bytestruct/
repo_url: https://github.com/doronz88/bytestruct
repo_name: doronz88/bytestruct
edit_uri: edit/master/docs/
copyright: Licensed under MIT

theme:
  name: material
  custom_dir: overrides
  logo: assets/logo.svg
  favicon: assets/logo.svg
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - toc.follow
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to system preference

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: sphinx
            show_root_heading: true
            show_source: true
            show_signature_annotations: true
            separate_signature: true
            members_order: source
            filters: ["!^_"]
            heading_level: 2
  # Emit /llms.txt and /llms-full.txt for LLM agents (llmstxt.org convention)
  - llmstxt:
      markdown_description: >-
        Typed, dependency-free binary records and composable codecs for Python 3.9+,
        a construct replacement built on the standard library's struct module.
      full_output: llms-full.txt
      sections:
        Getting started:
          - index.md
          - getting-started.md
        Guides:
          - records.md
          - codecs.md
          - byte-reader.md
          - streams.md
          - errors.md
          - extending.md
          - cookbook.md
          - how-it-works.md
          - migrating-from-construct.md
        Reference:
          - reference.md
          - api.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Guides:
      - Records: records.md
      - Codecs: codecs.md
      - ByteReader: byte-reader.md
      - Streams: streams.md
      - Errors: errors.md
      - Extending bytestruct: extending.md
      - Cookbook: cookbook.md
      - How it works: how-it-works.md
      - Migrating from construct: migrating-from-construct.md
  - Reference:
      - Type reference: reference.md
      - API reference: api.md
